# What the `pulseengine-wasm` realm carries.
#
# THIS FILE IS THE LAYER. Bumping a version here is the whole change — no
# workflow edit, no varve commit (REQ-PEL-MANIFEST-001).
#
# WHOSE ROOT SIGNS THIS, stated plainly because the payloads are not ours: the
# tools come from bytecodealliance releases, and the key that signs this layer
# is held by PulseEngine. The realm is therefore named `pulseengine-wasm` and
# not `bytecodealliance` — a realm name is a claim about who vouches, and
# naming it after the upstream would imply an endorsement nobody gave.
#
# WHAT IS PROVEN, AND WHAT IS NOT — measured 2026-09-18, stated here because a
# reader deserves it before reading the entries. Of the four upstreams, only
# `wasm-tools` publishes anything that vouches for its bytes (GitHub build
# provenance, which verifies). `wac`, `wkg` and `wrpc` publish neither
# cosign-signed sums nor provenance, so they are ingested with a REASON signed
# into the layer and are reported by `varve inspect` as proof = unverified.
#
# varve refused to deposit them until that reason was written, which is the
# behaviour to notice: nothing here is signed as though it were vouched for
# when it is not. What PulseEngine vouches for is the assembly — these exact
# bytes, from those exact releases, in one signed manifest — never the software.

[varve]
# The varve release whose binary AND assembler build this layer.
#
# v0.38.0, and THIS REALM IS WHY, for the second release running.
#
# The 2026-09-19 deposit of layer 2026.09.0 failed on varve's own refusal:
#
#   payload 'wac' from bytecodealliance/wac declares proof = "unverified" and
#   also names proof-signer "" — nothing vouched for these bytes, so naming an
#   identity that did would be signed, attributable and false.
#
# The refusal was right; the assembler was wrong. v0.37.0's ingest ladder
# reported "no signer" as an EMPTY STRING and staging wrapped it in a present
# field, so this realm's three opt-in payloads — wac, wkg, wit-bindgen-wrpc —
# were rendered as "somebody vouched and declined to say who" and the realm
# could not deposit a layer it had just assembled.
#
# v0.38.0 makes the state unrepresentable: the signer is an Option, absent
# means absent, and a blank signer is refused under every mechanism.
#
# v0.41.0, and THIS REALM IS WHY AGAIN — twice over, and this time the pin is
# not optional: v0.38.0 cannot parse this file, and could not deposit it if it
# could.
#
# First, varve refused bytes upstream fully attests (varve#245). The
# build-provenance rung probed ONE asset of a release and treated that
# statement's subject list as the release's complete set of covered digests.
# True for a publisher that batches — wasm-tools v1.260.0 puts ten subjects in
# one statement. False for one that calls attest-build-provenance per file:
# wasmtime v49.0.1 publishes one statement per asset, each naming one file, so
# three of its four assets were refused as unproven while
# `gh attestation verify` accepted every one of them. Fail-closed, so never a
# hole — but it stopped this realm depositing at all, and v0.38.0 and v0.40.0
# fail identically, so there was no older pin to retreat to.
#
# Second, `platforms` on a tool does not EXIST before v0.41.0, and the thirteen
# binaryen entries below need it. v0.38.0 rejects the field outright
# (`unknown field 'platforms'`) rather than ignoring it — which is the right
# failure, because ignoring it would widen those entries back to four platforms
# and rebuild the macOS payloads that cannot work.
#
# It also brings the measured libc floor (v0.40.0, REQ-LIBCSTATED-001), so this
# realm's Linux payloads will finally state the libc they need instead of
# leaving a consumer to discover it from a loader error.
version = "v0.41.0"

[realm]
name    = "pulseengine-wasm"
channel = "rolling"
# The trust root is NOT here — it is the public half consumers already hold.
# This repository holds the secret half as a secret, never as a file.
registry = "oci://ghcr.io/pulseengine/wasm-layers"

# ── the component-model toolchain ───────────────────────────────────────────
# Four upstreams, four different naming conventions. That is the point of a
# worked example: none of this is hypothetical, and a realm manifest has to
# express it without patching anything.

# A tarball per platform, named ARCH-OS in bytecodealliance's own style —
# `%U` exists for exactly this (`aarch64-macos`, not `aarch64-apple-darwin`).
[[tool]]
name    = "wasm-tools"
repo    = "bytecodealliance/wasm-tools"
version = "v1.260.0"
asset   = "wasm-tools-%V-%U.tar.gz"

# A bare binary per platform, and the file is called `wac-cli` while the tool
# a consumer runs is `wac`. Linux builds are MUSL, whose triple no template
# derives from a gnu one, so the four names are stated rather than guessed.
# MEASURED 2026-09-18, not assumed: this release publishes no cosign-signed
# SHA256SUMS.txt and no GitHub build provenance — `gh attestation verify` on
# wac-cli-x86_64-unknown-linux-musl answers 404. The same probe answers YES for
# wasm-tools, so this is a fact about wac's pipeline, not about the probe.
#
# Ingested anyway, with the reason signed into the layer and shown by
# `varve inspect` as proof = unverified. What this rests on: TLS to GitHub and
# GitHub's own integrity, for a release tag that is immutable once cut and whose
# digest this layer freezes. What it does NOT rest on: anyone's signature over
# those bytes.
#
# WHAT REMOVES THE NEED: bytecodealliance adding attest-build-provenance to
# wac's release workflow — one step, and the same step wasm-tools already has —
# or this organisation forking wac and cutting its release through a signed
# pipeline. Either is strictly better than this entry, and this entry should be
# deleted the day one lands.
[[tool]]
name    = "wac"
repo    = "bytecodealliance/wac"
version = "v0.12.0"
binary  = "wac"
layout  = "raw-per-platform"
unverified-reason = "bytecodealliance/wac v0.12.0 publishes neither cosign-signed sums nor build provenance (re-measured 2026-10-02: the release carries five bare binaries and no SHA256SUMS, .sig or .pem, and `gh attestation verify` returns 404 for its assets while the identical probe exits 0 for wasm-tools v1.260.0). Accepted for the rolling channel only: the tag is immutable, this layer freezes the digest, and the component-model toolchain is unusable without wac. Removed by upstream adding attest-build-provenance — one step, which wasm-tools already has — or by forking wac into pulseengine and releasing it through a signed pipeline."
[tool.asset-for]
"aarch64-apple-darwin"      = "wac-cli-aarch64-apple-darwin"
"x86_64-apple-darwin"       = "wac-cli-x86_64-apple-darwin"
"aarch64-unknown-linux-gnu" = "wac-cli-aarch64-unknown-linux-musl"
"x86_64-unknown-linux-gnu"  = "wac-cli-x86_64-unknown-linux-musl"

# A bare binary per platform whose names ARE Rust triples, so `%T` derives all
# four — the easy case, kept in the example so the hard ones stand out.
# Same measurement, same answer: no signed sums, no build provenance.
[[tool]]
name    = "wkg"
repo    = "bytecodealliance/wasm-pkg-tools"
version = "v0.16.1"
layout  = "raw-per-platform"
asset   = "wkg-%T"
unverified-reason = "bytecodealliance/wasm-pkg-tools v0.16.1 publishes neither cosign-signed sums nor build provenance (measured 2026-09-18). Accepted for the rolling channel only, on the same terms as wac: an immutable tag and a digest this layer freezes, with no signature over the bytes. Removed by upstream adding attest-build-provenance, or by forking into pulseengine."

# The repository is `wrpc` and the binary it ships is `wit-bindgen-wrpc`; the
# payload is deposited under the name a consumer dispatches. Linux is musl
# here too.
# Same measurement, same answer.
[[tool]]
name    = "wit-bindgen-wrpc"
repo    = "bytecodealliance/wrpc"
version = "v0.17.0"
layout  = "raw-per-platform"
unverified-reason = "bytecodealliance/wrpc v0.17.0 publishes neither cosign-signed sums nor build provenance (re-measured 2026-10-02: no SHA256SUMS, .sig or .pem on the release, and `gh attestation verify` returns 404 for its assets, while the identical probe exits 0 for wasmtime v49.0.1 and wasm-tools v1.260.0 in the same run). Accepted for the rolling channel only: the tag is immutable and this layer freezes the digest. One release supplies both wit-bindgen-wrpc and wrpc-wasmtime, so this is deliberately the same text for both — the opt-in is per RELEASE, and two reasons for one release would mean one of them was never checked. Removed by upstream adding attest-build-provenance, or by forking wrpc into pulseengine."
[tool.asset-for]
"aarch64-apple-darwin"      = "wit-bindgen-wrpc-aarch64-apple-darwin"
"x86_64-apple-darwin"       = "wit-bindgen-wrpc-x86_64-apple-darwin"
"aarch64-unknown-linux-gnu" = "wit-bindgen-wrpc-aarch64-unknown-linux-musl"
"x86_64-unknown-linux-gnu"  = "wit-bindgen-wrpc-x86_64-unknown-linux-musl"

# ── what rules_wasm_component needs and this realm did not carry ────────────
#
# Measured 2026-09-24 against pulseengine/rules_wasm_component's own pinned
# checksum set (`checksums/tools/*.json`): of the 22 tools that ruleset
# downloads, 12 were carried by no realm at all. Four of them are
# component-model tools of exactly the shape this realm already holds, so they
# belong here. The rest are a separate question — see the issue.

# The canonical bindings generator. This realm carried `wit-bindgen-wrpc`,
# which is wrpc's transport-specific generator and NOT a substitute: the tool
# a component author reaches for first was missing entirely.
[[tool]]
name    = "wit-bindgen"
repo    = "bytecodealliance/wit-bindgen"
version = "v0.62.0"
unverified-reason = "bytecodealliance/wit-bindgen v0.62.0 publishes neither cosign-signed sums nor build provenance (measured 2026-10-02: the release carries no SHA256SUMS, .sig or .pem, and `gh attestation verify` returns 404 for its assets, while the identical probe exits 0 for wasmtime v49.0.1 and wasm-tools v1.260.0 in the same run). Accepted for the rolling channel only: the tag is immutable, this layer freezes the digest, and generating bindings is the one step of the component-model toolchain nothing else performs. Removed by upstream adding attest-build-provenance — one step, which its sibling wasm-tools already has — or by forking wit-bindgen into pulseengine and releasing it through a signed pipeline."
asset   = "wit-bindgen-%V-%U.tar.gz"

# The runtime. `.tar.xz`, which the assembler picks by MAGIC rather than by
# file name — and wasmtime is the archive that made that necessary.
#
# The asset carries the RELEASE tag (`v49.0.0`), not the bare version, so the
# template uses %R. The `-c-api` variants publish under longer names and are
# deliberately not matched.
[[tool]]
name    = "wasmtime"
repo    = "bytecodealliance/wasmtime"
# 49.0.1, not 49.0.0: upstream 49.0.1 is a SECURITY release fixing
# GHSA-m63x-6p34-q65x (fuel-spend dropped for callees of `call_ref`
# and callees returning via exception throws) and GHSA-jqpg-j7w6-42pr
# (fuel spend for dynamic record lifting). Published 2026-09-24 and
# unnoticed here until 2026-09-30, because this realm scans only when
# a person asks it to — see pulseengine/varve#216.
version = "49.0.1"
release = "v49.0.1"
asset   = "wasmtime-%R-%U.tar.xz"

# wasm-opt and friends. Upstream's version IS the tag's suffix (`version_133`
# for version 133), which is why `release` and `version` differ here — the
# signed manifest says what the payload IS, and the tag says what to fetch
# (REQ-PAYLOADID-001).
#
# Apple silicon is `arm64-macos` and not `aarch64-macos`, the one platform
# whose name %U cannot derive, so that single asset is named outright rather
# than the whole set being hand-written.
# binaryen, as THIRTEEN tools and LINUX ONLY. Both halves are deliberate.
#
# THIRTEEN, because one `[[tool]]` is one executable and binaryen ships a
# toolbox: wasm-opt is the one everybody names, but wasm-merge, wasm-metadce
# and wasm-split are each the only thing that does their job. `binaryen` is a
# project, not a command, and an entry named after it found nothing in the
# archive -- the deposit failed with "the archive contains no file named
# binaryen". `binaryen-unittests` is deliberately NOT carried: it is the
# project's own test harness, not a tool a consumer runs.
#
# LINUX ONLY, because the macOS build cannot be a varve payload at all.
# Measured 2026-10-07: the Linux wasm-opt is 18.7 MB, statically linked, and
# references no libbinaryen. The macOS wasm-opt is a 1.7 MB stub that loads a
# 15 MB @rpath/libbinaryen.dylib from @loader_path/../lib. A varve tool
# payload is ONE executable with no sibling directory, so a macOS payload
# would be fetched, verified, signed into the layer, installed and verified
# again -- every check passing -- and then fail at the first exec.
#
# This is NOT "upstream does not build macOS": it does, and we decline to
# carry it. Saying so with `platforms` rather than by naming an asset that
# does not exist is varve REQ-TOOLPLAT-001 and DD-038; the alternative would
# make a 404 enact a policy and leave the reason recorded nowhere. varve
# refuses to translate this field into the legacy env encoding rather than
# widening it back.
#
# Carrying binaryen on macOS needs either a tool payload that can carry a
# runtime library beside the executable, or an `sdk` payload reached by path
# instead of by shim. Neither exists yet.

[[tool]]
name    = "wasm-opt"
repo    = "WebAssembly/binaryen"
version = "133"
release = "version_133"
asset   = "binaryen-%R-%U.tar.gz"
platforms = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
unverified-reason = "WebAssembly/binaryen version_133 publishes neither cosign-signed sums nor build provenance (measured 2026-10-02, re-measured 2026-10-07: no SHA256SUMS, .sig or .pem on the release, and `gh attestation verify` returns 404 for its assets, while the identical probe exits 0 for wasmtime v49.0.1 and wasm-tools v1.260.0 in the same run). Accepted for the rolling channel only: the tag is immutable and this layer freezes the digest. One release supplies all thirteen of these tools, so this is deliberately the same text for every one of them -- the opt-in is per RELEASE, and thirteen different reasons for one release would mean twelve of them were never checked. Note this is a DIFFERENT organisation from the bytecodealliance tools beside it, so the fork-and-sign route is a larger undertaking here. Removed by upstream adding attest-build-provenance, or by dropping binaryen if no consumer of this realm needs it."

